<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie znaleziono strony. MSI Telekom</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="stylesheet" href="/css/style.css?v=11">
</head>
<body class="theme-classic">
<main id="tresc">
  <section class="page-hero page-hero--full">
    <div class="wrap">
      <a class="brand brand--light" href="/" aria-label="MSI Telekom, strona główna"><img src="/assets/logo-stare.png" alt="MSI Telekom" width="127" height="42"></a>
      <h1>Nie znaleziono strony</h1>
      <p>Strona pod tym adresem nie istnieje lub została przeniesiona.</p>
      <p><a class="btn btn--solid" href="/">Strona główna</a> <a class="btn btn--outline" href="/kontakt/">Kontakt</a></p>
    </div>
  </section>
</main>
<script>
  /* Tylko wersja demo na GitHub Pages: strona leży tam w podkatalogu (np. /msi-telekom-2/),
     a ta strona błędu używa ścieżek od katalogu głównego domeny. Skrypt dopisuje podkatalog
     do linków, logo i stylów. Na docelowej domenie nic nie robi. */
  (function () {
    if (!/\.github\.io$/.test(location.hostname)) return;
    var base = '/' + location.pathname.split('/')[1] + '/';
    document.querySelectorAll('a[href^="/"], link[href^="/"]').forEach(function (el) {
      el.setAttribute('href', base + el.getAttribute('href').slice(1));
    });
    document.querySelectorAll('img[src^="/"]').forEach(function (el) {
      el.setAttribute('src', base + el.getAttribute('src').slice(1));
    });
  })();
</script>
</body>
</html>
